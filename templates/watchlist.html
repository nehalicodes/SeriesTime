<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Watchlist • SeriesTime</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a0000 40%, #330000 100%);
            min-height: 100vh;
            color: white;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            padding: 20px 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .title {
            font-size: 38px;
            font-weight: bold;
            color: #e50914;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
        }

        /* BACK BUTTON */
        .back-btn {
            position: absolute;
            left: 40px;
            top: 25px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            background: #e50914;
            padding: 8px 14px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #b20710;
        }

        /* WATCHLIST GRID */
        .watchlist-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
            color: #e50914;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        .card {
            width: 180px;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-title {
            padding: 12px;
            text-align: center;
            font-size: 16px;
        }

        .empty {
            text-align: center;
            margin-top: 60px;
            font-size: 20px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="/home " class="back-btn">← Back</a>
        <div class="title">SeriesTime</div>
    </div>

    <div class="watchlist-container">
        <h2>My Watchlist</h2>

        {% if items %}
        <div class="grid">
            {% for item in items %}
            <div class="card">
                <a href="/show/{{ item['show_id'] }}">
                    <img src="https://image.tmdb.org/t/p/w300{{ item['poster_path'] }}" alt="{{ item['show_name'] }}">
                </a>
                <div class="card-title">{{ item['show_name'] }}</div>
            </div>
            {% endfor %}
        </div>
        {% else %}
            <div class="empty">Your watchlist is empty.</div>
        {% endif %}
    </div>

</body>
</html>
