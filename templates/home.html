<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeriesTime</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('static/image/neti.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Dark overlay for readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: 1;
        }

        /* NAVBAR */
        .navbar {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            color: #e50914;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
        }

        /* PROFILE MENU */
        .profile-menu {
            position: absolute;
            right: 40px;
            top: 20px;
            z-index: 4;
        }

        .profile-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            width: 180px;
            background: rgba(0,0,0,0.9);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
        }

        .dropdown a {
            display: block;
            padding: 12px 18px;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .dropdown a:hover {
            background: #e50914;
        }

        .profile-menu:hover .dropdown,
        .dropdown:hover {
            display: block;
        }

        /* CENTER CONTENT */
        .center-container {
            position: relative;
            z-index: 3;
            top: 20%;
            text-align: center;
        }

        .center-container p {
            font-size: 48px;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .search-input {
            width: 600px;
            height: 60px;
            border-radius: 8px;
            border: none;
            padding: 0 20px;
            font-size: 18px;
            outline: none;
        }

        .submit-btn {
            margin-top: 20px;
            width: 200px;
            height: 55px;
            background: #e50914;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #b20710;
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="title"></div>
    </div>

    <!-- PROFILE DROPDOWN -->
    <div class="profile-menu">
        <div class="profile-icon">S</div>
        <div class="dropdown">
            <a href="/my_watchlist">My Watchlist</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- CENTER SEARCH AREA -->
    <div class="center-container">
        <p>Series Time</p>

        <form autocomplete="off" action="/seriesGraph" method="get">
            <input id="title" type="text" name="seriesTitle" class="search-input" placeholder="Enter the series name">
            <br>
            <button class="submit-btn" type="submit">Search</button>
        </form>
    </div>
    <script src="../static/js/home.js"></script>

</body>
</html>
